name: NBA Edge Pipeline

on:
  schedule:
    # Every 30m from 19:00–03:59 UTC (≈6am–3pm Sydney during AEDT/UTC+11).
    # In winter (AEST/UTC+10) each run lands one hour earlier Sydney — acceptable.
    - cron: "0,30 19,20,21,22,23,0,1,2,3 * * *"
    # 06:00 UTC ≈ 5pm Sydney during AEDT/UTC+11 (grading + next-slate prep).
    # In winter (AEST/UTC+10) lands one hour earlier Sydney — acceptable.
    - cron: "0 6 * * *"
    # 07:00 Sydney (AEDT ≈ 20:00 UTC prior day; AEST ≈ 21:00 UTC prior day — window in odds-schedule).
    - cron: "0 20 * * *"
    # Evening Sydney 21:00, 22:00, 23:00, 00:00, 01:00 (AEDT = 10–14 UTC; AEST = 9–13 UTC).
    - cron: "0 10,11,12,13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Fetch data branch
        run: |
          git fetch origin data:data || true
          if git show-ref --quiet refs/heads/data; then
            git checkout data -- public/data/history.json public/data/odds-cache.json public/data/official-card.json 2>/dev/null || true
          fi

      - run: npm ci
      - run: npm run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - run: npm run build

      - name: Upload odds coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-coverage
          path: public/data/odds-coverage.json
          if-no-files-found: ignore

      - name: Persist history to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:data 2>/dev/null || git checkout --orphan data
          mkdir -p public/data
          git add public/data/history.json public/data/odds-cache.json public/data/official-card.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline data"
          git push origin HEAD:data || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4