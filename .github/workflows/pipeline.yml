name: NBA Edge Pipeline

# Scheduled workflows only fire from default branch.

on:
  schedule:
    # Injury/model refresh: 19:00–03:30 UTC ≈ 6:00–14:30 Sydney (AEDT, Nov–Mar).
    - cron: "0,30 19,20,21,22,23,0,1,2,3 * * *"
    # 10:00–14:30 UTC = 21:00–01:30 Sydney — evening JSON refresh only (no odds pull).
    - cron: "0,30 10,11,12,13,14 * * *"
    # Evening backup slots (UTC → ~21:00 AEST/AEDT Sydney): 10:00, 10:10, 10:20, 10:35, 11:00
    - cron: "0 10 * * *"
    - cron: "10 10 * * *"
    - cron: "20 10 * * *"
    - cron: "35 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_odds:
        description: Budget odds for next slate top games; no official publish
        type: boolean
        default: false
      republish_card:
        description: Rebuild official-card.json for next slate (pre-tip); no odds unless force_odds
        type: boolean
        default: false
      odds_games:
        description: When force_odds, pull exactly this many top games (0 = budget allowance)
        type: number
        default: 0

concurrency:
  group: nba-edge-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.republish_card }}" = "true" ]; then
            echo "republish_card=1" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force_odds }}" = "true" ]; then
              echo "force_odds=1" >> "$GITHUB_OUTPUT"
              echo "skip_odds=0" >> "$GITHUB_OUTPUT"
            else
              echo "force_odds=0" >> "$GITHUB_OUTPUT"
              echo "skip_odds=1" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_odds }}" = "true" ]; then
            echo "force_odds=1" >> "$GITHUB_OUTPUT"
            echo "skip_odds=0" >> "$GITHUB_OUTPUT"
            echo "republish_card=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "${{ github.event.schedule }}" = "10 10 * * *" ] || [ "${{ github.event.schedule }}" = "20 10 * * *" ] || [ "${{ github.event.schedule }}" = "35 10 * * *" ] || [ "${{ github.event.schedule }}" = "0 11 * * *" ]; }; then
            echo "force_odds=0" >> "$GITHUB_OUTPUT"
            echo "skip_odds=0" >> "$GITHUB_OUTPUT"
            echo "republish_card=0" >> "$GITHUB_OUTPUT"
          else
            echo "force_odds=0" >> "$GITHUB_OUTPUT"
            echo "skip_odds=1" >> "$GITHUB_OUTPUT"
            echo "republish_card=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch data branch
        run: |
          git fetch origin data:data || true
          if git show-ref --quiet refs/heads/data; then
            git checkout data -- public/data/history.json public/data/odds-cache.json public/data/index.json public/data/game-log-cache.json 2>/dev/null || true
          fi

      - run: npm ci

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_EDGE_SUPABASE_URL: ${{ secrets.NBA_EDGE_SUPABASE_URL }}
          NBA_EDGE_SUPABASE_SECRET_KEY: ${{ secrets.NBA_EDGE_SUPABASE_SECRET_KEY }}
          PIPELINE_FORCE_ODDS: ${{ steps.mode.outputs.force_odds }}
          SKIP_ODDS_PULL: ${{ steps.mode.outputs.skip_odds }}
          PIPELINE_REPUBLISH_CARD: ${{ steps.mode.outputs.republish_card }}
          PIPELINE_ODDS_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.odds_games || 0 }}
          ODDS_RESERVE_CREDITS: "20"
        run: |
          echo "Workflow pipeline (dual-slate) force_odds=${{ steps.mode.outputs.force_odds }} skip_odds=${{ steps.mode.outputs.skip_odds }} republish_card=${{ steps.mode.outputs.republish_card }} odds_games=${PIPELINE_ODDS_GAMES}"
          npm run pipeline

      - run: npm run build

      - name: Upload odds coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-coverage
          path: public/data/odds-coverage.json
          if-no-files-found: ignore

      - name: Persist history to data branch
        continue-on-error: true
        run: bash scripts/persist-data-branch.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4