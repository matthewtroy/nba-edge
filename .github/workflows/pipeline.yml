name: NBA Edge Pipeline

on:
  schedule:
    # 10:00–14:30 UTC = 21:00–01:30 Sydney (AEDT, Nov–Mar).
    - cron: "0,30 10,11,12,13,14 * * *"
    # 19:00–03:30 UTC ≈ 06:00–14:30 Sydney (AEDT).
    - cron: "0,30 19,20,21,22,23,0,1,2,3 * * *"
    # 06:00 UTC = 17:00 Sydney (AEDT) / 16:00 (AEST) — morning odds window.
    - cron: "0 6 * * *"
    # 20:00 UTC ≈ 07:00 Sydney next calendar day (AEDT) — pre-tip odds window.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Fetch data branch
        run: |
          git fetch origin data:data || true
          if git show-ref --quiet refs/heads/data; then
            git checkout data -- public/data/history.json public/data/odds-cache.json public/data/index.json public/data/game-log-cache.json 2>/dev/null || true
            git checkout data -- public/data/ 2>/dev/null || true
          fi

      - run: npm ci

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "Workflow pipeline (dual-slate)"
          npm run pipeline

      - run: npm run build

      - name: Upload odds coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-coverage
          path: public/data/odds-coverage.json
          if-no-files-found: ignore

      - name: Persist history to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:data 2>/dev/null || git checkout --orphan data
          mkdir -p public/data
          git add public/data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline data"
          git push origin HEAD:data || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4