name: NBA Edge Pipeline

# Scheduled workflows only fire from default branch.

on:
  schedule:
    # Injury/model refresh: 19:00–03:30 UTC ≈ 6:00–14:30 Sydney (AEDT, Nov–Mar).
    - cron: "0,30 19,20,21,22,23,0,1,2,3 * * *"
    # 10:00–14:30 UTC = 21:00–01:30 Sydney — evening JSON refresh only (no odds pull).
    - cron: "0,30 10,11,12,13,14 * * *"
    # 10:00 and 11:00 UTC cover 21:00 Sydney (AEDT/AEST) for budgeted odds window.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_odds:
        description: Budget odds for next slate top games; no official publish
        type: boolean
        default: false

concurrency:
  group: nba-edge-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_odds }}" = "true" ]; then
            echo "force_odds=1" >> "$GITHUB_OUTPUT"
            echo "skip_odds=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "${{ github.event.schedule }}" = "0 11 * * *" ]; }; then
            echo "force_odds=0" >> "$GITHUB_OUTPUT"
            echo "skip_odds=0" >> "$GITHUB_OUTPUT"
          else
            echo "force_odds=0" >> "$GITHUB_OUTPUT"
            echo "skip_odds=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch data branch
        run: |
          git fetch origin data:data || true
          if git show-ref --quiet refs/heads/data; then
            git checkout data -- public/data/history.json public/data/odds-cache.json public/data/index.json public/data/game-log-cache.json 2>/dev/null || true
            git checkout data -- public/data/ 2>/dev/null || true
          fi

      - run: npm ci

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_EDGE_SUPABASE_URL: ${{ secrets.NBA_EDGE_SUPABASE_URL }}
          NBA_EDGE_SUPABASE_SECRET_KEY: ${{ secrets.NBA_EDGE_SUPABASE_SECRET_KEY }}
          PIPELINE_FORCE_ODDS: ${{ steps.mode.outputs.force_odds }}
          SKIP_ODDS_PULL: ${{ steps.mode.outputs.skip_odds }}
        run: |
          echo "Workflow pipeline (dual-slate) force_odds=${{ steps.mode.outputs.force_odds }} skip_odds=${{ steps.mode.outputs.skip_odds }}"
          npm run pipeline

      - run: npm run build

      - name: Upload odds coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-coverage
          path: public/data/odds-coverage.json
          if-no-files-found: ignore

      - name: Persist history to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:data 2>/dev/null || git checkout --orphan data
          mkdir -p public/data
          git add public/data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update pipeline data"
          git push origin HEAD:data || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4